<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Style Mitra Fashion</title>
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div id="topbarText" class="topbar__text"></div>
    </div>
  </header>

  <nav class="nav">
    <div class="container nav__inner">
      <button class="icon-btn" aria-label="Menu" onclick="document.body.classList.toggle('nav-open')">☰</button>
      <div class="brand" id="brandName">Style Mitra Fashion</div>
      <div class="nav__actions">
        <a class="icon-btn" href="/admin/" title="Admin" aria-label="Admin">👤</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <section class="hero">
      <div class="hero__left">
        <h1 id="heroTitle">STYLE MITRA FASHION</h1>
        <p id="heroSubtitle" class="muted"></p>
        <a id="heroWaBtn" class="btn btn-primary" target="_blank" rel="noopener">Order on WhatsApp</a>
      </div>
      <div class="hero__right">
        <img id="heroImage" class="hero__img" alt="Hero banner" />
      </div>
    </section>

    <section class="cats" aria-label="Categories">
      <div id="categoriesGrid" class="cats__grid"></div>
    </section>

    <section class="section">
      <div class="section__title" id="trendingTitle">TRENDING NOW</div>
      <div class="filters">
        <button class="chip chip--active" data-filter="all">All</button>
        <div id="filterChips"></div>
        <input id="searchBox" class="search" type="search" placeholder="Search product…" />
      </div>

      <div id="productsGrid" class="products"></div>
      <div id="emptyState" class="empty hidden">No products found.</div>
    </section>

    <footer class="footer">
      <div class="muted">© <span id="year"></span> <span id="brandNameFooter">Style Mitra Fashion</span></div>
      <a class="muted" href="/admin/">Admin</a>
    </footer>
  </main>

  <script src="/assets/main.js"></script>
</body>
</html>
